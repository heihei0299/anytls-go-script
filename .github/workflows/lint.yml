name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck -S warning $(git ls-files '*.sh')
